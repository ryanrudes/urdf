[project]
name = "urdf"
version = "0.1.0"
description = "Parse URDF files and generate typed robot definitions."
readme = "README.md"
authors = [
    { name = "Ryan Rudes", email = "ryanrudes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.17.1",
]
keywords = ["urdf", "robotics", "codegen", "typing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/ryanrudes/urdf"
Source = "https://github.com/ryanrudes/urdf"
Issues = "https://github.com/ryanrudes/urdf/issues"
Documentation = "https://ryanrudes.github.io/urdf/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mkdocs",
    "pre-commit",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[tool.hatch.envs.dev]
dependencies = [
    "mkdocs",
    "pre-commit",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[tool.hatch.envs.dev.scripts]
generate-robot = "python -m urdf.cli {args}"
sync-robots = "python -m urdf.cli --sync"
format = "ruff format src tests"
lint = "ruff check src tests"
test = "python -m unittest discover -s tests -v"
docs = "mkdocs serve"
docs-build = "mkdocs build"
